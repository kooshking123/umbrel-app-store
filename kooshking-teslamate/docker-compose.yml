version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: kooshking-teslamate_teslamate_1
      APP_PORT: 4000
  teslamate:
    image: >-
      teslamate/teslamate:4.4.0@sha256:c85b3d447502683ed7bf12fb478e0dae9a985fe975ac22cccb64faeb4c4a5d31
    restart: on-failure
    environment:
      - ENCRYPTION_KEY=${APP_KOOSHKING_TESLAMATE_ENCRYPTION_KEY}
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${APP_KOOSHKING_TESLAMATE_DATABASE_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
      - MQTT_HOST=mosquitto
    volumes:
      - ${APP_DATA_DIR}/data/import:/opt/app/import
    cap_drop:
      - all
    depends_on:
      - database
      - mosquitto
  database:
    image: >-
      postgres:18-trixie@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: on-failure
    environment:
      - POSTGRES_USER=teslamate
      - POSTGRES_PASSWORD=${APP_KOOSHKING_TESLAMATE_DATABASE_PASS}
      - POSTGRES_DB=teslamate
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
  grafana:
    image: >-
      teslamate/grafana:latest@sha256:2dd1fae85cd891e1d851350d13b547abf000efd602c8d0e5734eda6d43e22e01
    restart: on-failure
    # Umbrel's bind-mounted data directories are created owned by root, so
    # Grafana must start as root: its entrypoint then fixes the data
    # directory's ownership to the grafana user and drops privileges.
    # Running it as 1000:1000 (or its default 472) cannot write to a
    # root-owned bind mount and crash-loops with "GF_PATHS_DATA is not
    # writable" -- verified on a real Umbrel install 3 Nov 2026.
    user: "0:0"
    environment:
      - DATABASE_USER=teslamate
      - DATABASE_PASS=${APP_KOOSHKING_TESLAMATE_DATABASE_PASS}
      - DATABASE_NAME=teslamate
      - DATABASE_HOST=database
    # Grafana is published directly: Umbrel's app proxy fronts only the
    # TeslaMate UI. Change Grafana's default admin/admin login on first use.
    ports:
      - "3000:3000"
    volumes:
      - ${APP_DATA_DIR}/data/grafana:/var/lib/grafana
    depends_on:
      - database
  mosquitto:
    image: >-
      eclipse-mosquitto:2@sha256:860aeb5d63ce509508f6dcfb2bc8a1c1dd2bc60555b562b45ce90e52d8dabb0f
    restart: on-failure
    command: mosquitto -c /mosquitto-no-auth.conf
    volumes:
      - ${APP_DATA_DIR}/data/mosquitto-conf:/mosquitto/config
      - ${APP_DATA_DIR}/data/mosquitto-data:/mosquitto/data
